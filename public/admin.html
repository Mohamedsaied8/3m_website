<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3M Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="/img/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* minimal admin-only additions */
    .gate {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--ink); color: var(--paper); padding: 1rem;
    }
    .gate-card { text-align: center; max-width: 380px; width: 100%; }
    .gate-card img { width: 110px; height: 110px; border-radius: 50%; border: 1px solid var(--gold); margin: 0 auto 1.4rem; }
    .gate-card h2 { font-size: 1.8rem; font-weight: 400; letter-spacing: .12em; }
    .gate-card .label { display: block; margin: .4rem 0 1.8rem; }
    .gate-card input {
      width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(213,185,131,.4);
      color: var(--paper); padding: .85rem 1rem; border-radius: var(--r); letter-spacing: .1em; text-align: center;
    }
    .gate-card input:focus { outline: none; border-color: var(--gold); }
    .gate-card button { margin-top: 1rem; width: 100%; justify-content: center; border-color: var(--gold); color: var(--gold-2); }
    .gate-card button:hover { background: var(--gold); color: var(--ink); }
    .admin-top {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: .8rem 1.2rem; background: var(--ink); color: var(--paper);
      border-bottom: 1px solid var(--gold);
    }
    .admin-top .lk { font-size: .75rem; letter-spacing: .15em; text-transform: uppercase; opacity: .75; }
    .admin-top .lk:hover { color: var(--gold-2); opacity: 1; }
    .admin-crumbs { color: var(--muted); font-size: .8rem; margin-bottom: .7rem; }
    #tabProducts .note { border-inline-start: 3px solid var(--gold); }
  </style>
</head>
<body data-page="admin" class="admin-body">

  <!-- ============ LOGIN GATE ============ -->
  <div id="loginGate">
    <div class="gate">
      <div class="gate-card">
        <img src="/img/logo.jpeg" alt="3M">
        <h2>3M · Admin</h2>
        <span class="label">Store management</span>
        <form id="loginForm">
          <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password" required>
          <button class="btn" type="submit" id="loginBtn">Enter</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="adminApp" class="hidden">
    <div class="admin-top">
      <div style="display:flex;align-items:center;gap:.8rem">
        <img src="/img/logo.jpeg" alt="" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--gold)">
        <b style="letter-spacing:.2em;font-family:var(--sans);font-size:.8rem">3M FASHION — ADMIN</b>
      </div>
      <div style="display:flex;gap:1rem;align-items:center">
        <a class="lk" href="/" target="_blank">View store ↗</a>
        <button class="lk" id="logoutBtn" style="background:none;border:0;cursor:pointer">Logout</button>
      </div>
    </div>

    <div class="admin-wrap">
      <aside class="admin-side">
        <button data-tab="overview" class="on">◈ <span>Overview</span></button>
        <button data-tab="products">◇ <span>Products</span></button>
        <button data-tab="orders">□ <span>Orders</span></button>
        <button data-tab="settings">✦ <span>Settings</span></button>
        <button class="logout" id="logoutBtn2">⤫ Logout</button>
      </aside>
      <div class="admin-main" id="tabContent"></div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
