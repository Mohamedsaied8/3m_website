<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — 3M Fashion</title>
  <meta name="description" content="3M Fashion — premium home wear & eastern clothes in pure cotton.">
  <link rel="icon" type="image/jpeg" href="/img/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Almarai:wght@300;400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="shop">
  <div id="site-head"></div>

  <main>
    <div class="wrap">
      <div class="breadcrumb" id="crumb"><a href="/shop" data-i18n="nav.shop"></a></div>
    </div>

    <section class="pad" style="padding-top:1rem">
      <div class="wrap pd-grid" id="pdWrap">
        <div class="pd-gallery">
          <div class="pd-main"><img id="pdMain" src="" alt=""></div>
          <div class="pd-thumbs" id="pdThumbs"></div>
        </div>
        <div class="pd-info" id="pdInfo"></div>
      </div>
    </section>

    <section class="pad pad-alt hidden" id="relatedSec">
      <div class="wrap">
        <div class="sec-head">
          <span class="label" data-i18n="nav.shop"></span>
          <h2 data-i18n="pd.related"></h2>
          <div class="rule"></div>
        </div>
        <div class="grid-products" id="relatedGrid"></div>
      </div>
    </section>
  </main>

  <div id="site-foot"></div>
  <script src="/js/app.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
